name: e2e

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, arbitrum]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.20"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Pin a concrete version: resolving "stable" makes foundryup list
      # releases via api.github.com, which gets rate-limited (403) on shared
      # runners.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache v0.9 contract artifacts
        uses: actions/cache@v4
        with:
          path: e2e/artifacts
          key: e2e-artifacts-${{ hashFiles('e2e/src/fetch-artifacts.ts') }}

      # If the fork RPC secret is unavailable (e.g. PRs from forks), anvil
      # starts without a fork and the suite degrades gracefully.
      - name: Run ${{ matrix.chain }} e2e suite
        run: scripts/e2e/run.sh ${{ matrix.chain }}
        env:
          ETH_MAINNET_RPC_URL: ${{ secrets.ETH_RPC }}
          ARB_MAINNET_RPC_URL: ${{ secrets.ARB_RPC }}

      - name: Upload anvil + bundler logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.chain }}
          path: tmp/e2e/*.log
          if-no-files-found: ignore
