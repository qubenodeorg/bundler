# Production deployment for the qubenode ERC-4337 bundler (Dokploy / Docker Compose).
#
# The bundler EOA private key is supplied as an environment variable
# (ERC4337_BUNDLER_PRIVATE_KEY), exactly like the RPC URL. Set it in Dokploy's
# Environment settings or in a .env file next to this compose file.

services:
  bundler:
    build:
      context: .
      args:
        VERSION: ${BUNDLER_VERSION:-dev}
    # To deploy a prebuilt image instead of building, comment out `build:` above
    # and set, e.g.:  image: ghcr.io/qubenodeorg/bundler:latest
    image: qubenode-bundler:latest
    restart: unless-stopped

    environment:
      # --- Required ---
      # The upstream Ethereum JSON-RPC endpoint. Set this in Dokploy's
      # Environment settings (or a .env file next to this compose file).
      ERC4337_BUNDLER_ETH_CLIENT_URL: ${ERC4337_BUNDLER_ETH_CLIENT_URL:?set ERC4337_BUNDLER_ETH_CLIENT_URL}

      # The bundler EOA private key. The binary accepts an optional 0x prefix.
      # On Dokploy, set this in the Environment tab (use the secret/sensitive
      # option if available). Locally, set it in a gitignored .env file.
      ERC4337_BUNDLER_PRIVATE_KEY: ${ERC4337_BUNDLER_PRIVATE_KEY:?set ERC4337_BUNDLER_PRIVATE_KEY}

      # --- Optional (sensible defaults baked into the image) ---
      # SUPPORTED_ENTRY_POINTS defaults to all four canonical EntryPoints
      # (v0.6-v0.9), so a single instance serves every version. Override only to
      # restrict the set:
      # ERC4337_BUNDLER_SUPPORTED_ENTRY_POINTS: "0x433709009B8330FDa32311DF1C2AFA402eD8D009"
      ERC4337_BUNDLER_PORT: "4337"
      ERC4337_BUNDLER_DATA_DIRECTORY: /data
      ERC4337_BUNDLER_DEBUG_MODE: "false"
      # Rollup helpers (uncomment for the matching chain):
      # ERC4337_BUNDLER_IS_OP_STACK_NETWORK: "true"
      # ERC4337_BUNDLER_IS_ARB_STACK_NETWORK: "true"

      # --- Optional: shared storage (multiple replicas) ---
      # Uncomment these and the `redis` service below to back the mempool with
      # Redis/Valkey instead of the node-local BadgerDB. See docs/STORAGE.md.
      # ERC4337_BUNDLER_STORE_BACKEND: "redis"
      # ERC4337_BUNDLER_STORE_URL: "redis://redis:6379/0"
      # ERC4337_BUNDLER_STORE_NAMESPACE: "qubenode"
      # ERC4337_BUNDLER_STORE_OP_TTL_SECONDS: "180"

    ports:
      # host:container. In Dokploy you can instead route to container port 4337
      # via the built-in Traefik proxy + a domain and drop this mapping.
      - "4337:4337"

    volumes:
      # Persist the BadgerDB mempool across restarts/redeploys.
      - bundler-data:/data

    # The image ships a HEALTHCHECK using a built-in healthcheck subcommand;
    # restate it here so Compose/Dokploy surface health without depending on
    # image internals.
    healthcheck:
      test: ["CMD", "/app/qubenode-bundler", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: shared storage for multi-replica deployments. Enable together
  # with the ERC4337_BUNDLER_STORE_* variables on the bundler service above.
  # In production prefer a managed Redis/Valkey with TLS and auth.
  # redis:
  #   image: valkey/valkey:7-alpine
  #   restart: unless-stopped
  #   command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
  #   volumes:
  #     - redis-data:/data

volumes:
  bundler-data:
  # redis-data:
