# Production deployment for the qubenode ERC-4337 bundler (Dokploy / Docker Compose).
#
# The bundler EOA private key is supplied as a Docker secret (a file mounted at
# /run/secrets/bundler_private_key), NOT as a plaintext environment variable.
# The binary itself only reads the key from ERC4337_BUNDLER_PRIVATE_KEY, so the
# entrypoint below loads the secret file into that variable at startup (stripping
# surrounding whitespace and an optional 0x prefix) and then exec's the bundler
# so it remains PID 1 and receives SIGTERM for graceful shutdown.

services:
  bundler:
    build:
      context: .
      args:
        VERSION: ${BUNDLER_VERSION:-dev}
    # To deploy a prebuilt image instead of building, comment out `build:` above
    # and set, e.g.:  image: ghcr.io/qubenodeorg/bundler:latest
    image: qubenode-bundler:latest
    restart: unless-stopped

    secrets:
      - bundler_private_key

    environment:
      # --- Required ---
      # The upstream Ethereum JSON-RPC endpoint. Set this in Dokploy's
      # Environment settings (or a .env file next to this compose file).
      ERC4337_BUNDLER_ETH_CLIENT_URL: ${ERC4337_BUNDLER_ETH_CLIENT_URL:?set ERC4337_BUNDLER_ETH_CLIENT_URL}

      # --- Optional (sensible defaults baked into the image) ---
      # SUPPORTED_ENTRY_POINTS defaults to all four canonical EntryPoints
      # (v0.6-v0.9), so a single instance serves every version. Override only to
      # restrict the set:
      # ERC4337_BUNDLER_SUPPORTED_ENTRY_POINTS: "0x433709009B8330FDa32311DF1C2AFA402eD8D009"
      ERC4337_BUNDLER_PORT: "4337"
      ERC4337_BUNDLER_DATA_DIRECTORY: /data
      ERC4337_BUNDLER_DEBUG_MODE: "false"
      # Rollup helpers (uncomment for the matching chain):
      # ERC4337_BUNDLER_IS_OP_STACK_NETWORK: "true"
      # ERC4337_BUNDLER_IS_ARB_STACK_NETWORK: "true"

    # Load the secret into the env var, then hand off (exec) to the bundler.
    # `$$` escapes the `$` from Compose interpolation so it reaches the shell.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -r /run/secrets/bundler_private_key ]; then
          echo "FATAL: /run/secrets/bundler_private_key missing or unreadable by uid $$(id -u); chmod it 0444" >&2
          exit 1
        fi
        KEY="$$(tr -d ' \t\r\n' < /run/secrets/bundler_private_key)"
        export ERC4337_BUNDLER_PRIVATE_KEY="$${KEY#0x}"
        exec /app/qubenode-bundler start --mode private

    ports:
      # host:container. In Dokploy you can instead route to container port 4337
      # via the built-in Traefik proxy + a domain and drop this mapping.
      - "4337:4337"

    volumes:
      # Persist the BadgerDB mempool across restarts/redeploys.
      - bundler-data:/data

    # The image ships a HEALTHCHECK hitting /live; restate it here so Compose/
    # Dokploy surface health without depending on image internals.
    healthcheck:
      # GET (discarding the body), not --spider: the liveness route is GET-only,
      # so a HEAD request (what --spider sends) returns 404.
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:4337/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  bundler_private_key:
    # File-based secret. Create ./secrets/bundler_private_key.txt containing the
    # bare hex key (no 0x, no trailing newline) and chmod it 0444 so the
    # in-container bundler user (uid 10001) can read it. The file is gitignored.
    file: ./secrets/bundler_private_key.txt

volumes:
  bundler-data:
